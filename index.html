<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UOB IT PMO — Kanban Board</title>
<style>
  /* ============================================================
     Design tokens — corporate blue palette, spacing scale
     ============================================================ */
  :root {
    --color-primary: #0b3d78;
    --color-primary-dark: #072a54;
    --color-primary-light: #e7eff8;
    --color-bg: #f2f5f9;
    --color-surface: #ffffff;
    --color-border: #d7dee8;
    --color-text: #1a2433;
    --color-text-muted: #5b6b82;

    --color-critical: #b3261e;
    --color-critical-bg: #fbe4e2;
    --color-high: #93500a;
    --color-high-bg: #fdecc8;
    --color-medium: #1d4ed8;
    --color-medium-bg: #dfe8fd;
    --color-low: #556074;
    --color-low-bg: #e7eaef;

    --color-success: #1c6b34;
    --color-success-bg: #e3f5e6;
    --color-warning-bg: #93500a;

    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;

    --radius: 10px;
    --radius-sm: 6px;

    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  /* ============================================================
     Base / reset
     ============================================================ */
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    background: var(--color-bg);
    color: var(--color-text);
    line-height: 1.4;
  }
  h1, h2, h3, p { margin: 0; }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible {
    outline: 3px solid #ffb703;
    outline-offset: 2px;
  }

  /* ============================================================
     Header
     ============================================================ */
  .app-header {
    background: var(--color-primary);
    color: #fff;
    padding: var(--space-4) var(--space-5);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: var(--space-4);
  }
  .wordmark { font-size: 1.35rem; font-weight: 700; letter-spacing: 0.3px; }
  .wordmark small { display: block; font-size: 0.68rem; font-weight: 400; opacity: 0.85; letter-spacing: 0.4px; }
  .btn {
    border: none;
    border-radius: var(--radius-sm);
    padding: var(--space-2) var(--space-4);
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary { background: #ffffff; color: var(--color-primary); }
  .btn-primary:hover { background: #eef3fa; }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

  /* Summary strip */
  .summary-strip {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-5);
    padding: var(--space-3) var(--space-5);
    background: var(--color-primary-dark);
    color: #fff;
    font-size: 0.82rem;
  }
  .summary-item strong { display: block; font-size: 1.05rem; }
  .summary-item.overdue strong { color: #ffb4ac; }

  /* Demo-mode note */
  .demo-note {
    padding: var(--space-2) var(--space-5);
    font-size: 0.78rem;
    color: var(--color-text-muted);
    background: var(--color-primary-light);
    border-bottom: 1px solid var(--color-border);
  }

  /* ============================================================
     Filter bar
     ============================================================ */
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-4);
    align-items: flex-end;
    padding: var(--space-4) var(--space-5);
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
  }
  .filter-field { display: flex; flex-direction: column; gap: 4px; font-size: 0.8rem; }
  .filter-field label { font-weight: 600; color: var(--color-text-muted); }
  .filter-field input,
  .filter-field select {
    padding: 6px 10px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    min-width: 180px;
    background: var(--color-surface);
  }

  /* ============================================================
     Board / columns
     ============================================================ */
  main { display: block; }
  .board {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--space-4);
    padding: var(--space-5);
  }
  @media (max-width: 768px) {
    .board { grid-template-columns: 1fr; }
    .filter-field select, .filter-field input { min-width: 140px; }
  }

  .column {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    display: flex;
    flex-direction: column;
    min-height: 220px;
  }
  .column-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: var(--space-3) var(--space-4);
    background: var(--color-primary-light);
    border-bottom: 1px solid var(--color-border);
    border-radius: var(--radius) var(--radius) 0 0;
  }
  .column-header h2 { font-size: 0.95rem; color: var(--color-primary-dark); }
  .count-badge {
    background: var(--color-primary);
    color: #fff;
    border-radius: 999px;
    padding: 2px 10px;
    font-size: 0.78rem;
    font-weight: 700;
    min-width: 22px;
    text-align: center;
  }
  .card-list {
    padding: var(--space-3);
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
    flex: 1;
    min-height: 90px;
  }
  .column.drag-over {
    outline: 2px dashed var(--color-primary);
    outline-offset: -2px;
    background: var(--color-primary-light);
  }
  .empty-column-hint {
    color: var(--color-text-muted);
    font-size: 0.8rem;
    text-align: center;
    padding: var(--space-4) var(--space-2);
    font-style: italic;
  }

  /* ============================================================
     Cards
     ============================================================ */
  .card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-left: 5px solid var(--color-low);
    border-radius: var(--radius-sm);
    padding: var(--space-3);
    box-shadow: 0 1px 2px rgba(20, 30, 50, 0.06);
    cursor: grab;
  }
  .card.dragging { opacity: 0.5; }
  .card[data-priority="Critical"] { border-left-color: var(--color-critical); }
  .card[data-priority="High"] { border-left-color: var(--color-high); }
  .card[data-priority="Medium"] { border-left-color: var(--color-medium); }
  .card[data-priority="Low"] { border-left-color: var(--color-low); }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: var(--space-2);
  }
  .card-id { font-size: 0.7rem; color: var(--color-text-muted); font-family: ui-monospace, Consolas, monospace; }
  .card-title { font-weight: 700; font-size: 0.92rem; margin: var(--space-1) 0 var(--space-2); }
  .card-sub { font-size: 0.78rem; color: var(--color-text-muted); margin-bottom: var(--space-2); }
  .card-badges { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-bottom: var(--space-2); }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 0.7rem;
    font-weight: 700;
    border: 1px solid transparent;
  }
  .pill[data-priority="Critical"] { background: var(--color-critical-bg); color: var(--color-critical); }
  .pill[data-priority="High"] { background: var(--color-high-bg); color: var(--color-high); }
  .pill[data-priority="Medium"] { background: var(--color-medium-bg); color: var(--color-medium); }
  .pill[data-priority="Low"] { background: var(--color-low-bg); color: var(--color-low); }

  .tag {
    background: var(--color-low-bg);
    color: var(--color-text-muted);
    padding: 2px 9px;
    border-radius: var(--radius-sm);
    font-size: 0.7rem;
    font-weight: 600;
  }
  .badge-overdue {
    background: var(--color-critical);
    color: #fff;
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 0.68rem;
    font-weight: 700;
  }

  .card-due { font-size: 0.76rem; color: var(--color-text-muted); margin-bottom: var(--space-2); }

  .card-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: var(--space-2);
    border-top: 1px solid var(--color-border);
    padding-top: var(--space-2);
    margin-top: var(--space-1);
  }
  .card-move { display: flex; align-items: center; gap: 4px; font-size: 0.72rem; }
  .card-move label { color: var(--color-text-muted); font-weight: 600; }
  .card-move select {
    padding: 3px 6px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    font-size: 0.72rem;
  }
  .btn-delete {
    background: transparent;
    border: none;
    color: var(--color-text-muted);
    font-size: 1.05rem;
    line-height: 1;
    padding: 2px 8px;
    border-radius: var(--radius-sm);
  }
  .btn-delete:hover { background: var(--color-critical-bg); color: var(--color-critical); }

  .confirm-delete {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--color-critical);
  }
  .confirm-delete button {
    border: 1px solid var(--color-critical);
    background: #fff;
    color: var(--color-critical);
    border-radius: var(--radius-sm);
    padding: 2px 8px;
    font-size: 0.72rem;
    font-weight: 700;
  }
  .confirm-delete button.confirm-yes { background: var(--color-critical); color: #fff; }

  /* ============================================================
     Modal (Add Task)
     ============================================================ */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(10, 20, 40, 0.5);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: var(--space-5);
    overflow-y: auto;
    z-index: 100;
  }
  .modal-backdrop[hidden] { display: none; }
  .modal {
    background: var(--color-surface);
    border-radius: var(--radius);
    max-width: 560px;
    width: 100%;
    padding: var(--space-5);
    margin-top: var(--space-6);
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: var(--space-4);
  }
  .modal-header h2 { font-size: 1.1rem; color: var(--color-primary-dark); }
  .btn-close {
    background: transparent;
    border: none;
    font-size: 1.3rem;
    line-height: 1;
    color: var(--color-text-muted);
    padding: 2px 8px;
    border-radius: var(--radius-sm);
  }
  .btn-close:hover { background: var(--color-primary-light); }

  .form-grid { display: flex; flex-direction: column; gap: var(--space-4); }
  .form-row { display: flex; gap: var(--space-4); flex-wrap: wrap; }
  .form-field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 200px; }
  .form-field label { font-size: 0.82rem; font-weight: 600; }
  .form-field input,
  .form-field select,
  .form-field textarea {
    padding: 8px 10px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    background: var(--color-surface);
  }
  .form-field textarea { resize: vertical; min-height: 70px; }
  .form-field input[aria-invalid="true"],
  .form-field select[aria-invalid="true"],
  .form-field textarea[aria-invalid="true"] { border-color: var(--color-critical); }
  .field-error { color: var(--color-critical); font-size: 0.74rem; min-height: 1em; }
  .form-actions { display: flex; justify-content: flex-end; gap: var(--space-3); margin-top: var(--space-2); }
  .btn-cancel { background: var(--color-low-bg); color: var(--color-text); }
  .btn-submit { background: var(--color-primary); color: #fff; }
  .btn-submit:hover { background: var(--color-primary-dark); }

  /* ============================================================
     Toasts
     ============================================================ */
  .toast-region {
    position: fixed;
    bottom: calc(var(--space-5) + 70px);
    right: var(--space-4);
    display: flex;
    flex-direction: column;
    gap: var(--space-2);
    z-index: 200;
    max-width: 320px;
  }
  .toast {
    padding: var(--space-3) var(--space-4);
    border-radius: var(--radius-sm);
    color: #fff;
    font-size: 0.84rem;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.18);
    animation: toast-in 0.2s ease-out;
  }
  .toast-success { background: var(--color-success); }
  .toast-warning { background: var(--color-warning-bg); }
  @keyframes toast-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ============================================================
     Floating WhatsApp support widget
     ============================================================ */
  .whatsapp-fab {
    position: fixed;
    bottom: var(--space-5);
    right: var(--space-5);
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #25d366;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 12px rgba(20, 30, 50, 0.28);
    z-index: 150;
    text-decoration: none;
    transition: transform 0.15s ease-out, box-shadow 0.15s ease-out;
  }
  .whatsapp-fab:hover {
    transform: scale(1.06);
    box-shadow: 0 6px 16px rgba(20, 30, 50, 0.34);
  }
  .whatsapp-fab svg { width: 30px; height: 30px; fill: #fff; }
  .whatsapp-fab-label {
    position: fixed;
    bottom: calc(var(--space-5) + 66px);
    right: var(--space-5);
    background: var(--color-primary-dark);
    color: #fff;
    font-size: 0.74rem;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: var(--radius-sm);
    white-space: nowrap;
    z-index: 150;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease-out;
  }
  .whatsapp-fab:hover + .whatsapp-fab-label,
  .whatsapp-fab:focus-visible + .whatsapp-fab-label {
    opacity: 1;
  }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>
<body>

  <!-- ============================================================
       Header: wordmark, add-task action, live summary strip
       ============================================================ -->
  <header class="app-header">
    <div class="wordmark">
      UOB IT PMO
      <small>Internal demo &mdash; IT Project Management Kanban</small>
    </div>
    <button type="button" class="btn btn-primary" id="btn-add-task">+ Add Task</button>
  </header>

  <section class="summary-strip" id="summary-strip" aria-label="Board summary">
    <!-- populated by renderSummary() -->
  </section>

  <p class="demo-note">
    Demo mode: board data lives only in this browser tab's memory. Refreshing or closing the page resets the board to the seeded demo data — nothing is saved.
  </p>

  <!-- ============================================================
       Filter bar
       ============================================================ -->
  <section class="filter-bar" aria-label="Filter tasks">
    <div class="filter-field">
      <label for="filter-project">Project / Workstream</label>
      <select id="filter-project">
        <option value="">All Projects</option>
        <option value="Core Banking Upgrade">Core Banking Upgrade</option>
        <option value="Digital Channels">Digital Channels</option>
        <option value="Cybersecurity Uplift">Cybersecurity Uplift</option>
        <option value="Data &amp; Analytics">Data &amp; Analytics</option>
        <option value="Infrastructure &amp; Cloud">Infrastructure &amp; Cloud</option>
        <option value="Vendor Management">Vendor Management</option>
      </select>
    </div>
    <div class="filter-field">
      <label for="filter-assignee">Assignee contains</label>
      <input type="text" id="filter-assignee" placeholder="e.g. Priya">
    </div>
    <div class="filter-field">
      <label for="filter-priority">Priority</label>
      <select id="filter-priority">
        <option value="">All Priorities</option>
        <option value="Critical">Critical</option>
        <option value="High">High</option>
        <option value="Medium">Medium</option>
        <option value="Low">Low</option>
      </select>
    </div>
  </section>

  <!-- ============================================================
       Board: 4 fixed columns, card lists rendered by renderBoard()
       ============================================================ -->
  <main>
    <div class="board" id="board">
      <div class="column" data-status="Backlog">
        <div class="column-header">
          <h2>Backlog</h2>
          <span class="count-badge" id="count-Backlog">0</span>
        </div>
        <div class="card-list" id="cardlist-Backlog"></div>
      </div>
      <div class="column" data-status="In Progress">
        <div class="column-header">
          <h2>In Progress</h2>
          <span class="count-badge" id="count-In Progress">0</span>
        </div>
        <div class="card-list" id="cardlist-In Progress"></div>
      </div>
      <div class="column" data-status="Blocked">
        <div class="column-header">
          <h2>Blocked</h2>
          <span class="count-badge" id="count-Blocked">0</span>
        </div>
        <div class="card-list" id="cardlist-Blocked"></div>
      </div>
      <div class="column" data-status="Done">
        <div class="column-header">
          <h2>Done</h2>
          <span class="count-badge" id="count-Done">0</span>
        </div>
        <div class="card-list" id="cardlist-Done"></div>
      </div>
    </div>
  </main>

  <!-- ============================================================
       Add Task modal
       ============================================================ -->
  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h2 id="modal-title">Add Task</h2>
        <button type="button" class="btn-close" id="btn-modal-close" aria-label="Close add task dialog">&times;</button>
      </div>
      <form id="add-task-form" novalidate>
        <div class="form-grid">
          <div class="form-field">
            <label for="field-title">Task Title *</label>
            <input type="text" id="field-title" name="title" maxlength="80">
            <span class="field-error" id="error-title"></span>
          </div>

          <div class="form-field">
            <label for="field-description">Description</label>
            <textarea id="field-description" name="description" maxlength="500"></textarea>
            <span class="field-error" id="error-description"></span>
          </div>

          <div class="form-row">
            <div class="form-field">
              <label for="field-project">Project / Workstream *</label>
              <select id="field-project" name="project">
                <option value="">-- Select --</option>
                <option value="Core Banking Upgrade">Core Banking Upgrade</option>
                <option value="Digital Channels">Digital Channels</option>
                <option value="Cybersecurity Uplift">Cybersecurity Uplift</option>
                <option value="Data &amp; Analytics">Data &amp; Analytics</option>
                <option value="Infrastructure &amp; Cloud">Infrastructure &amp; Cloud</option>
                <option value="Vendor Management">Vendor Management</option>
              </select>
              <span class="field-error" id="error-project"></span>
            </div>
            <div class="form-field">
              <label for="field-category">Category *</label>
              <select id="field-category" name="category">
                <option value="">-- Select --</option>
                <option value="Application Development">Application Development</option>
                <option value="Infrastructure">Infrastructure</option>
                <option value="Cybersecurity">Cybersecurity</option>
                <option value="Data">Data</option>
                <option value="Compliance">Compliance</option>
                <option value="Vendor">Vendor</option>
              </select>
              <span class="field-error" id="error-category"></span>
            </div>
          </div>

          <div class="form-row">
            <div class="form-field">
              <label for="field-assignee">Assignee *</label>
              <input type="text" id="field-assignee" name="assignee">
              <span class="field-error" id="error-assignee"></span>
            </div>
            <div class="form-field">
              <label for="field-priority">Priority</label>
              <select id="field-priority" name="priority">
                <option value="Critical">Critical</option>
                <option value="High">High</option>
                <option value="Medium" selected>Medium</option>
                <option value="Low">Low</option>
              </select>
              <span class="field-error" id="error-priority"></span>
            </div>
          </div>

          <div class="form-row">
            <div class="form-field">
              <label for="field-duedate">Due Date *</label>
              <input type="date" id="field-duedate" name="dueDate">
              <span class="field-error" id="error-dueDate"></span>
            </div>
            <div class="form-field">
              <label for="field-status">Status</label>
              <select id="field-status" name="status">
                <option value="Backlog" selected>Backlog</option>
                <option value="In Progress">In Progress</option>
                <option value="Blocked">Blocked</option>
                <option value="Done">Done</option>
              </select>
              <span class="field-error" id="error-status"></span>
            </div>
          </div>

          <div class="form-actions">
            <button type="button" class="btn btn-cancel" id="btn-modal-cancel">Cancel</button>
            <button type="submit" class="btn btn-submit" id="btn-modal-submit">Add Task</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- ============================================================
       Floating WhatsApp support widget
       ============================================================ -->
  <a
    class="whatsapp-fab"
    href="https://wa.me/6599659965"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Chat with UOB IT Support on WhatsApp"
  >
    <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false">
      <path d="M16.02 3C9.4 3 4 8.4 4 15.02c0 2.36.63 4.58 1.72 6.5L4 29l7.66-1.66c1.83.94 3.9 1.47 6.07 1.47h.01C24.36 28.81 29.76 23.4 29.76 16.79 29.76 10.17 24.65 3 16.02 3zm0 24.19h-.01c-1.94 0-3.85-.52-5.51-1.5l-.4-.24-4.55.98.97-4.44-.26-.46a10.93 10.93 0 0 1-1.68-5.83c0-6.07 4.94-11.01 11.02-11.01 5.88 0 10.99 5.08 10.99 11.32 0 6.07-5.14 11.18-10.57 11.18zm6.04-8.23c-.33-.17-1.96-.97-2.27-1.08-.3-.11-.53-.17-.75.17-.22.33-.86 1.08-1.06 1.3-.19.22-.39.25-.72.08-.33-.17-1.39-.51-2.65-1.63-.98-.87-1.64-1.95-1.83-2.28-.19-.33-.02-.51.15-.67.15-.15.33-.39.5-.58.17-.2.22-.33.33-.55.11-.22.06-.42-.03-.58-.08-.17-.75-1.8-1.03-2.47-.27-.65-.55-.56-.75-.57-.19-.01-.42-.01-.64-.01-.22 0-.58.08-.89.42-.3.33-1.17 1.14-1.17 2.78 0 1.64 1.2 3.22 1.37 3.44.17.22 2.36 3.6 5.71 5.05.8.35 1.42.55 1.9.71.8.25 1.53.22 2.11.13.64-.1 1.96-.8 2.24-1.57.28-.77.28-1.43.19-1.57-.08-.14-.3-.22-.63-.39z"/>
    </svg>
  </a>
  <span class="whatsapp-fab-label" aria-hidden="true">UOB IT Support</span>

  <!-- ============================================================
       Toast region (aria-live so screen readers announce toasts)
       ============================================================ -->
  <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>

<script>
  "use strict";

  // ============================================================
  // Configuration
  //
  // FormSubmit requires a one-time activation: the FIRST submission
  // sent to this address triggers a confirmation email from FormSubmit.
  // Notifications only start delivering after the activation link in
  // that email is clicked. Swap the address below to redirect where
  // "new task" notifications are sent — this is the only place it
  // needs to change.
  // ============================================================
  const FORMSUBMIT_ENDPOINT = "https://formsubmit.co/ajax/uobclaude2@outlook.com";

  const STATUSES = ["Backlog", "In Progress", "Blocked", "Done"];
  const PRIORITIES = ["Critical", "High", "Medium", "Low"];

  // ============================================================
  // State — single source of truth. All rendering reads from here.
  // ============================================================
  const state = {
    tasks: [],
    filters: { project: "", assignee: "", priority: "" },
    confirmingDeleteId: null,
    nextIdCounter: 1
  };

  // ============================================================
  // Seed data — demo tasks spread across all four columns.
  // Reset to this on every page load (no persistence, by design).
  // ============================================================
  function buildSeedTasks() {
    return [
      { id: "UOB-ITPM-0001", title: "Migrate FX pricing service to AWS", description: "Lift-and-shift the FX pricing microservice to the new AWS landing zone ahead of the data-centre exit.", project: "Infrastructure & Cloud", category: "Infrastructure", assignee: "Priya Nair", priority: "Critical", dueDate: "2026-09-10", status: "In Progress" },
      { id: "UOB-ITPM-0002", title: "Patch CVE-2025-41288 on branch teller VDI", description: "Roll out vendor security patch across all branch teller virtual desktops.", project: "Cybersecurity Uplift", category: "Cybersecurity", assignee: "Marcus Tan", priority: "Critical", dueDate: "2026-09-25", status: "Blocked" },
      { id: "UOB-ITPM-0003", title: "UAT sign-off for mobile onboarding release 4.2", description: "Coordinate business UAT sign-off before release 4.2 goes to production.", project: "Digital Channels", category: "Application Development", assignee: "Elena Cruz", priority: "High", dueDate: "2026-09-22", status: "In Progress" },
      { id: "UOB-ITPM-0004", title: "Decommission legacy core banking batch scheduler", description: "Retire the legacy overnight batch scheduler once the replacement job orchestrator is validated.", project: "Core Banking Upgrade", category: "Infrastructure", assignee: "Rajiv Sharma", priority: "Medium", dueDate: "2026-10-15", status: "Backlog" },
      { id: "UOB-ITPM-0005", title: "Vendor risk assessment for new SWIFT gateway provider", description: "Complete third-party risk assessment before onboarding the new SWIFT gateway vendor.", project: "Vendor Management", category: "Vendor", assignee: "Siti Rahman", priority: "High", dueDate: "2026-09-05", status: "Blocked" },
      { id: "UOB-ITPM-0006", title: "Build customer churn dashboard for retail analytics", description: "Deliver a self-serve dashboard for the retail analytics team to monitor churn indicators.", project: "Data & Analytics", category: "Data", assignee: "Wei Liang", priority: "Low", dueDate: "2026-10-01", status: "Backlog" },
      { id: "UOB-ITPM-0007", title: "Complete PCI-DSS quarterly compliance scan", description: "Run and document the quarterly PCI-DSS compliance scan across cardholder data environments.", project: "Cybersecurity Uplift", category: "Compliance", assignee: "Marcus Tan", priority: "High", dueDate: "2026-09-18", status: "In Progress" },
      { id: "UOB-ITPM-0008", title: "Archive Q2 core banking migration documentation", description: "File final migration runbooks and sign-off documents in the compliance archive.", project: "Core Banking Upgrade", category: "Application Development", assignee: "Priya Nair", priority: "Low", dueDate: "2026-08-30", status: "Done" }
    ];
  }

  // ============================================================
  // Utility helpers
  // ============================================================
  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function todayStr() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }

  function formatDate(isoDate) {
    if (!isoDate) return "";
    const [y, m, d] = isoDate.split("-").map(Number);
    const date = new Date(y, m - 1, d);
    return date.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" });
  }

  function isOverdue(task) {
    return task.status !== "Done" && task.dueDate < todayStr();
  }

  function generateTaskId() {
    const id = `UOB-ITPM-${String(state.nextIdCounter).padStart(4, "0")}`;
    state.nextIdCounter += 1;
    return id;
  }

  // ============================================================
  // Filtering — pure function over the task array
  // ============================================================
  function applyFilters(tasks, filters) {
    return tasks.filter((task) => {
      if (filters.project && task.project !== filters.project) return false;
      if (filters.priority && task.priority !== filters.priority) return false;
      if (filters.assignee && !task.assignee.toLowerCase().includes(filters.assignee.toLowerCase())) return false;
      return true;
    });
  }

  // ============================================================
  // Rendering — renderBoard() is the only place that touches
  // card DOM content; everything re-renders from `state`.
  // ============================================================
  function renderCard(task) {
    const overdue = isOverdue(task);
    const isConfirming = state.confirmingDeleteId === task.id;

    const deleteControl = isConfirming
      ? `<span class="confirm-delete">
           Delete?
           <button type="button" class="confirm-yes" data-action="confirm-delete" data-id="${escapeHtml(task.id)}">Yes</button>
           <button type="button" class="confirm-no" data-action="cancel-delete" data-id="${escapeHtml(task.id)}">No</button>
         </span>`
      : `<button type="button" class="btn-delete" data-action="request-delete" data-id="${escapeHtml(task.id)}" aria-label="Delete task ${escapeHtml(task.id)}: ${escapeHtml(task.title)}">&times;</button>`;

    const moveOptions = STATUSES.map(
      (s) => `<option value="${escapeHtml(s)}" ${s === task.status ? "selected" : ""}>${escapeHtml(s)}</option>`
    ).join("");

    return `
      <article class="card" draggable="true" data-id="${escapeHtml(task.id)}" data-priority="${escapeHtml(task.priority)}">
        <div class="card-top">
          <span class="card-id">${escapeHtml(task.id)}</span>
          ${deleteControl}
        </div>
        <h3 class="card-title">${escapeHtml(task.title)}</h3>
        <p class="card-sub">${escapeHtml(task.project)} &middot; ${escapeHtml(task.assignee)}</p>
        <div class="card-badges">
          <span class="pill" data-priority="${escapeHtml(task.priority)}">${escapeHtml(task.priority)}</span>
          <span class="tag">${escapeHtml(task.category)}</span>
          ${overdue ? `<span class="badge-overdue">&#9200; Overdue</span>` : ""}
        </div>
        <p class="card-due">Due ${escapeHtml(formatDate(task.dueDate))}</p>
        <div class="card-footer">
          <div class="card-move">
            <label for="move-${escapeHtml(task.id)}">Move &#9656;</label>
            <select id="move-${escapeHtml(task.id)}" class="move-select" data-action="move" data-id="${escapeHtml(task.id)}" aria-label="Move task ${escapeHtml(task.id)} to a different column">
              ${moveOptions}
            </select>
          </div>
        </div>
      </article>
    `;
  }

  function renderBoard() {
    const filtered = applyFilters(state.tasks, state.filters);

    STATUSES.forEach((status) => {
      const listEl = document.getElementById(`cardlist-${status}`);
      const countEl = document.getElementById(`count-${status}`);
      const tasksInColumn = filtered.filter((t) => t.status === status);

      listEl.innerHTML = tasksInColumn.length
        ? tasksInColumn.map(renderCard).join("")
        : `<p class="empty-column-hint">No tasks</p>`;
      countEl.textContent = String(tasksInColumn.length);
    });

    renderSummary();
  }

  function renderSummary() {
    const el = document.getElementById("summary-strip");
    const total = state.tasks.length;
    const overdueCount = state.tasks.filter(isOverdue).length;

    const statusCounts = STATUSES.map((status) => {
      const count = state.tasks.filter((t) => t.status === status).length;
      return `<div class="summary-item"><strong>${count}</strong>${escapeHtml(status)}</div>`;
    }).join("");

    el.innerHTML = `
      <div class="summary-item"><strong>${total}</strong>Total Tasks</div>
      ${statusCounts}
      <div class="summary-item overdue"><strong>${overdueCount}</strong>Overdue</div>
    `;
  }

  // ============================================================
  // Task actions
  // ============================================================
  function addTask(taskData) {
    const task = {
      id: generateTaskId(),
      title: taskData.title.trim(),
      description: taskData.description.trim(),
      project: taskData.project,
      category: taskData.category,
      assignee: taskData.assignee.trim(),
      priority: taskData.priority,
      dueDate: taskData.dueDate,
      status: taskData.status
    };
    state.tasks.push(task);
    renderBoard();
    return task;
  }

  function moveTask(id, newStatus) {
    const task = state.tasks.find((t) => t.id === id);
    if (!task || !STATUSES.includes(newStatus)) return;
    task.status = newStatus;
    renderBoard();
  }

  function deleteTask(id) {
    state.tasks = state.tasks.filter((t) => t.id !== id);
    state.confirmingDeleteId = null;
    renderBoard();
  }

  // ============================================================
  // Toasts
  // ============================================================
  function showToast(message, type) {
    const region = document.getElementById("toast-region");
    const toast = document.createElement("div");
    toast.className = `toast ${type === "warning" ? "toast-warning" : "toast-success"}`;
    toast.textContent = message;
    region.appendChild(toast);
    setTimeout(() => toast.remove(), 4500);
  }

  // ============================================================
  // FormSubmit integration — fire-and-report; never blocks the UI.
  // ============================================================
  async function notifyNewTask(task) {
    const res = await fetch(FORMSUBMIT_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: JSON.stringify({
        _subject: `[UOB IT PMO] New task ${task.id}: ${task.title}`,
        _template: "table",
        _captcha: "false",
        "Task ID": task.id,
        Title: task.title,
        Description: task.description,
        Project: task.project,
        Category: task.category,
        Assignee: task.assignee,
        Priority: task.priority,
        "Due Date": task.dueDate,
        Status: task.status,
        "Submitted At": new Date().toISOString()
      })
    });
    if (!res.ok) throw new Error(`FormSubmit failed: ${res.status}`);
    return res.json();
  }

  // ============================================================
  // Form validation
  // ============================================================
  function validateForm(data) {
    const errors = {};

    if (!data.title.trim()) errors.title = "Task title is required.";
    else if (data.title.length > 80) errors.title = "Task title must be 80 characters or fewer.";

    if (data.description.length > 500) errors.description = "Description must be 500 characters or fewer.";

    if (!data.project) errors.project = "Please select a project / workstream.";
    if (!data.category) errors.category = "Please select a category.";
    if (!data.assignee.trim()) errors.assignee = "Assignee is required.";

    if (!data.dueDate) errors.dueDate = "Due date is required.";
    else if (data.dueDate < todayStr()) errors.dueDate = "Due date cannot be in the past.";

    return errors;
  }

  function displayFormErrors(errors) {
    const fields = ["title", "description", "project", "category", "assignee", "dueDate", "status"];
    fields.forEach((field) => {
      const errorEl = document.getElementById(`error-${field}`);
      const inputEl = document.getElementById(`field-${field === "dueDate" ? "duedate" : field}`);
      const message = errors[field] || "";
      if (errorEl) errorEl.textContent = message;
      if (inputEl) {
        if (message) inputEl.setAttribute("aria-invalid", "true");
        else inputEl.removeAttribute("aria-invalid");
      }
    });
  }

  // ============================================================
  // Modal handling
  // ============================================================
  const modalBackdrop = document.getElementById("modal-backdrop");
  const addTaskForm = document.getElementById("add-task-form");
  const submitBtn = document.getElementById("btn-modal-submit");
  const addTaskBtn = document.getElementById("btn-add-task");

  function openModal() {
    displayFormErrors({});
    document.getElementById("field-duedate").setAttribute("min", todayStr());
    modalBackdrop.hidden = false;
    document.getElementById("field-title").focus();
    document.addEventListener("keydown", onModalKeydown);
  }

  function closeModal() {
    modalBackdrop.hidden = true;
    addTaskForm.reset();
    displayFormErrors({});
    document.removeEventListener("keydown", onModalKeydown);
    addTaskBtn.focus();
  }

  function onModalKeydown(e) {
    if (e.key === "Escape") closeModal();
  }

  addTaskBtn.addEventListener("click", openModal);
  document.getElementById("btn-modal-close").addEventListener("click", closeModal);
  document.getElementById("btn-modal-cancel").addEventListener("click", closeModal);
  modalBackdrop.addEventListener("click", (e) => {
    if (e.target === modalBackdrop) closeModal();
  });

  addTaskForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    const formData = {
      title: document.getElementById("field-title").value,
      description: document.getElementById("field-description").value,
      project: document.getElementById("field-project").value,
      category: document.getElementById("field-category").value,
      assignee: document.getElementById("field-assignee").value,
      priority: document.getElementById("field-priority").value,
      dueDate: document.getElementById("field-duedate").value,
      status: document.getElementById("field-status").value
    };

    const errors = validateForm(formData);
    displayFormErrors(errors);
    if (Object.keys(errors).length > 0) return;

    submitBtn.disabled = true;
    submitBtn.textContent = "Sending…";

    // Optimistic UI: the card is created and rendered immediately,
    // independent of whether the FormSubmit notification succeeds.
    const task = addTask(formData);

    try {
      await notifyNewTask(task);
      showToast(`Task ${task.id} added and notification sent.`, "success");
    } catch (err) {
      showToast("Card added locally — email notification failed.", "warning");
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Add Task";
      closeModal();
    }
  });

  // ============================================================
  // Filter bar wiring
  // ============================================================
  document.getElementById("filter-project").addEventListener("change", (e) => {
    state.filters.project = e.target.value;
    renderBoard();
  });
  document.getElementById("filter-assignee").addEventListener("input", (e) => {
    state.filters.assignee = e.target.value;
    renderBoard();
  });
  document.getElementById("filter-priority").addEventListener("change", (e) => {
    state.filters.priority = e.target.value;
    renderBoard();
  });

  // ============================================================
  // Board interactions: delete / confirm / move — delegated once
  // on the board container so re-rendering never loses listeners.
  // ============================================================
  const boardEl = document.getElementById("board");

  boardEl.addEventListener("click", (e) => {
    const target = e.target.closest("[data-action]");
    if (!target) return;
    const { action, id } = target.dataset;

    if (action === "request-delete") {
      state.confirmingDeleteId = id;
      renderBoard();
    } else if (action === "cancel-delete") {
      state.confirmingDeleteId = null;
      renderBoard();
    } else if (action === "confirm-delete") {
      deleteTask(id);
    }
  });

  boardEl.addEventListener("change", (e) => {
    const select = e.target.closest('[data-action="move"]');
    if (!select) return;
    moveTask(select.dataset.id, select.value);
  });

  // ============================================================
  // Drag and drop (native HTML5 DnD)
  // ============================================================
  boardEl.addEventListener("dragstart", (e) => {
    const card = e.target.closest(".card");
    if (!card) return;
    e.dataTransfer.setData("text/plain", card.dataset.id);
    e.dataTransfer.effectAllowed = "move";
    card.classList.add("dragging");
  });

  boardEl.addEventListener("dragend", (e) => {
    const card = e.target.closest(".card");
    if (card) card.classList.remove("dragging");
  });

  document.querySelectorAll(".column").forEach((column) => {
    column.addEventListener("dragover", (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      column.classList.add("drag-over");
    });
    column.addEventListener("dragleave", (e) => {
      if (!column.contains(e.relatedTarget)) column.classList.remove("drag-over");
    });
    column.addEventListener("drop", (e) => {
      e.preventDefault();
      column.classList.remove("drag-over");
      const id = e.dataTransfer.getData("text/plain");
      moveTask(id, column.dataset.status);
    });
  });

  // ============================================================
  // Init
  // ============================================================
  state.tasks = buildSeedTasks();
  state.nextIdCounter = state.tasks.length + 1;
  renderBoard();
</script>
</body>
</html>
